[package]
name = "pigeonsms-sdk"
version = "1.0.0-beta.1"
edition = "2021"
description = "Official Rust SDK for Open Pigeon Protocol servers"
license = "MIT"
repository = "https://github.com/realcgcristi/pigeonsms"
keywords = ["pigeonsms", "open-pigeon", "chat", "bot", "sdk"]
categories = ["api-bindings", "network-programming", "web-programming::websocket"]

[features]
default = ["gateway"]
gateway = ["dep:futures-util", "dep:tokio-tungstenite"]

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http = "1"
