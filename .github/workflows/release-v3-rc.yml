name: release v3 rc

on:
  push:
    tags:
      - v3-rc*

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm test --prefix backend
      - run: npm run typecheck --prefix backend
      - name: worker dry run
        working-directory: backend
        run: npx wrangler deploy --dry-run
      - name: clean migration rehearsal
        working-directory: backend
        run: npx wrangler d1 migrations apply pigeon-db --local --persist-to ../.d1-rc-ci
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: npm test --prefix protocol/conformance

  android:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: signing keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > pigeon-debug.keystore
          else
            keytool -genkey -v -keystore pigeon-debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: firebase config
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          fi
      - name: build apk
        working-directory: android
        run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: prepare apk
        run: cp android/app/build/outputs/apk/release/app-release.apk PigeonSMS_3.0.0-rc.1_android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pigeonsms-v3-rc1-android
          path: PigeonSMS_3.0.0-rc.1_android.apk
          if-no-files-found: error

  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix web
      - run: npm ci --prefix desktop
      - run: npm run build:windows --prefix desktop
      - name: prepare installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          Copy-Item -LiteralPath $installer.FullName -Destination PigeonSMS_3.0.0-rc.1_x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pigeonsms-v3-rc1-windows
          path: PigeonSMS_3.0.0-rc.1_x64-setup.exe
          if-no-files-found: error

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: checksums
        working-directory: release-assets
        run: sha256sum PigeonSMS_* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PigeonSMS v3-rc1
          prerelease: true
          generate_release_notes: true
          body: |
            v3-rc1 adds nest time machine, networkless nearby messaging and public key transparency across Android, web and Windows.

            included:
            - Android release APK
            - Windows NSIS installer
            - SHA-256 checksums
          files: release-assets/*
