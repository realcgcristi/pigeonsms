name: release v3 rc

on:
  push:
    tags:
      - v3-rc*

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm test --prefix backend
      - run: npm run typecheck --prefix backend
      - name: worker dry run
        working-directory: backend
        run: npx wrangler deploy --dry-run
      - name: clean migration rehearsal
        working-directory: backend
        run: npx wrangler d1 migrations apply pigeon-db --local --persist-to ../.d1-rc-ci
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: npm test --prefix protocol/conformance

  android:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: signing keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is required for an official rc build"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > pigeon-debug.keystore
          actual=$(keytool -exportcert -keystore pigeon-debug.keystore -storepass android -alias androiddebugkey | openssl dgst -sha256 -r | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g;s/:$//')
          expected="50:FC:57:9A:0E:28:95:1A:47:EB:61:59:CB:25:06:73:6B:90:E4:2F:57:07:A7:AA:70:F7:D1:B9:65:12:FE:BF"
          if [ "$actual" != "$expected" ]; then
            echo "android signing certificate does not match assetlinks.json"
            exit 1
          fi
      - name: firebase config
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          fi
      - name: build apk
        working-directory: android
        run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: prepare apk
        run: cp android/app/build/outputs/apk/release/app-release.apk PigeonSMS_3.0.0-rc.1_android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pigeonsms-v3-rc1-android
          path: PigeonSMS_3.0.0-rc.1_android.apk
          if-no-files-found: error

  windows:
    needs: quality
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: require updater signing key
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY is required for an official rc build' }
      - run: npm ci --prefix web
      - run: npm ci --prefix desktop
      - run: npm run build:windows --prefix desktop
      - name: prepare installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw 'updater signature was not produced' }
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $assetName = "PigeonSMS_${version}_x64-setup.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $assetName
          Copy-Item -LiteralPath $signaturePath -Destination "$assetName.sig"
          $manifest = [ordered]@{
            version = $version
            notes = "PigeonSMS $version"
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = @{
              'windows-x86_64' = @{
                signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$assetName"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath latest.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: pigeonsms-v3-rc1-windows
          path: |
            PigeonSMS_*.exe
            PigeonSMS_*.exe.sig
            latest.json
          if-no-files-found: error

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: checksums
        working-directory: release-assets
        run: sha256sum PigeonSMS_* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PigeonSMS v3-rc1
          prerelease: true
          generate_release_notes: true
          body: |
            v3-rc1 adds nest time machine, networkless nearby messaging and public key transparency across Android, web and Windows.

            included:
            - Android release APK
            - Windows NSIS installer
            - SHA-256 checksums
          files: release-assets/*
