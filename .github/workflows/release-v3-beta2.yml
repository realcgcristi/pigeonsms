name: release v3 beta2

on:
  push:
    tags:
      - v3-beta*

permissions:
  contents: write

jobs:
  android:
    name: android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: signing keystore
        working-directory: android
        run: |
          keytool -genkey -v -keystore pigeon-debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: build release apk
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pigeonsms-v3-beta2-android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  windows:
    name: windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: install web dependencies
        run: npm ci --prefix web
      - name: install desktop dependencies
        run: npm ci --prefix desktop
      - name: build windows installers
        run: npm run build:windows --prefix desktop
      - uses: actions/upload-artifact@v4
        with:
          name: pigeonsms-v3-beta2-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  publish:
    name: publish github release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PigeonSMS ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            v3-beta2 ships the current Open Pigeon platform beta.

            included:
            - Android release APK
            - Windows NSIS installer
            - Windows MSI installer
          files: release-assets/**
