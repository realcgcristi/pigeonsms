name: build

# build-only: compiles + signs the release APK and uploads it as an artifact.
# does NOT publish a public release (that stays with the oss repo for the atomic ship).
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: set up android sdk
        uses: android-actions/setup-android@v3

      - name: signing keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > pigeon-debug.keystore
          else
            keytool -genkey -v -keystore pigeon-debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: firebase config
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          fi

      - name: build release apk
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: upload apk
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pigeonsms-v3-rc1-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  desktop:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix web
      - run: npm ci --prefix desktop
      - name: signed windows bundle
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: npm run build:windows --prefix desktop
      - name: compile without signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: npm run build:app --prefix desktop
      - name: verify updater signature
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          if (-not (Test-Path -LiteralPath "$($installer.FullName).sig")) { throw 'signed updater artifact was not produced' }
      - uses: actions/upload-artifact@v4
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        with:
          name: pigeonsms-windows-signed
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
